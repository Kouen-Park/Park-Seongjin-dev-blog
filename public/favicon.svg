<!--
  parkseongjin.me 파비콘 — 틸데(~).
  사이트가 프로젝트 목록에서 쓰는 ~/ 표기를 아이콘화한 것입니다.

  설계상 주의:
  - 폰트가 아니라 베지에 곡선으로 그렸습니다. 파비콘 안의 <text>는
    브라우저·OS에 설치된 폰트에 따라 결과가 달라집니다.
  - 바탕을 어두운 색으로 고정했습니다. prefers-color-scheme으로 색을
    반전시키면 어두운 탭 배경에서 흰 얼룩처럼 보입니다.
  - 글리프를 하나만 둔 이유는 16px(실제 탭 크기)에서 형태가 남아야 하기 때문입니다.
    요소를 더 넣으면 선이 서로 붙습니다.

  편집용 원본과 다른 후보안: ~/.kiro/crew/workspace/images/favicon-*.svg
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
	<rect id="background" x="0" y="0" width="64" height="64" rx="14" fill="#0f1310" />
	<path
		id="tilde"
		d="M13 36 C18 24, 27 24, 32 32 C37 40, 46 40, 51 28"
		fill="none"
		stroke="#4ade80"
		stroke-width="8"
		stroke-linecap="round"
	/>
</svg>
